<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>향기 성향 테스트</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background: linear-gradient(135deg,#ffd6e0,#ffeaf1);
  text-align:center;
}
.cover{
  height:100vh;
  background:url('https://images.unsplash.com/photo-1594035910387-fea47794261f') center/cover;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
}
.cover button{
  padding:12px 25px;
  border:none;
  border-radius:20px;
  background:#ff8fab;
  color:white;
}
.container{display:none; padding:20px;}
button{
  margin:10px;
  padding:12px 20px;
  border:none;
  border-radius:20px;
  background:#ff8fab;
  color:white;
}
.result{
  padding:30px;
  border-radius:20px;
  margin-top:30px;
  background:#fff0f3;
}
</style>
</head>
<body>

<div class="cover" id="cover">
  <h1>나에게 어울리는 향은?</h1>
  <button onclick="start()">테스트 시작</button>
</div>

<div class="container" id="app">
  <div id="quiz"></div>
  <div id="result"></div>
</div>

<script>
const questions = [
{"q":"Q1. 사람들과 있을 때 나는?","a":[
{"text":"눈에 띈다","type":"citrus"},
{"text":"조용하다","type":"floral"},
{"text":"귀엽다","type":"sweet"},
{"text":"차분하다","type":"woody"}]},
{"q":"Q2. 좋아하는 날씨는?","a":[
{"text":"맑은 날","type":"citrus"},
{"text":"봄날","type":"floral"},
{"text":"따뜻한 실내","type":"sweet"},
{"text":"비 오는 날","type":"woody"}]}
];

let current=0;
let scores={citrus:0, floral:0, sweet:0, woody:0};

function start(){
  document.getElementById('cover').style.display='none';
  document.getElementById('app').style.display='block';
  showQuestion();
}

function showQuestion(){
  let q=questions[current];
  let html="<h2>"+q.q+"</h2>";
  q.a.forEach(ans=>{
    html+=`<button onclick="answer('${ans.type}')">${ans.text}</button><br>`;
  });
  document.getElementById("quiz").innerHTML=html;
}

function answer(type){
  scores[type]++;
  current++;
  if(current<questions.length){
    showQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  let max=Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b);

  const data={
    citrus:{title:"시트러스 타입",desc:"상큼한 당신"},
    floral:{title:"플로럴 타입",desc:"부드러운 당신"},
    sweet:{title:"구르망 타입",desc:"달콤한 당신"},
    woody:{title:"우디 타입",desc:"차분한 당신"}
  };

  let r=data[max];
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").innerHTML=`
  <div class="result">
    <h1>${r.title}</h1>
    <p>${r.desc}</p>
  </div>`;
}
</script>

</body>
</html>
